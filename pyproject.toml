[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zhihupost"
version = "0.1.0"
description = "Command-line tools for Zhihu publishing"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py",
    "mdit-py-plugins",
    "PyYAML",
    "httpx",
    "oss2",
    "platformdirs",
]

[project.optional-dependencies]
test = ["pytest", "build"]

[project.scripts]
zhihupost = "zhihupost.cli:main"

[tool.setuptools.packages.find]
include = ["zhihupost*"]
